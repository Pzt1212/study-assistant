# ============================================================
# 学习助手 - 媒体库 Nginx 配置示例（Linux 生产环境）
# 场景 A：默认 r2 直传 —— Nginx 只反代 Flask 的 API/页面，
#         媒体字节在浏览器与 R2 之间直连，不经本机。
# 场景 B：proxy 通道（本机有公网 IP / 国内 frp 直连端口）——
#         把 /media/api/proxy/* 分块上传与本地 Range 流的缓冲关掉。
#
# 用法：按域名/路径调整后放入 /etc/nginx/conf.d/，
#       先 `nginx -t` 再 reload。Windows 本地跑 waitress/flask 时无需本文件。
# ============================================================

# ---- 上游：Flask 应用（waitress/gunicorn 监听本机 8000）----
upstream study_assistant {
    server 127.0.0.1:8000;
    keepalive 16;
}

# ------------------------------------------------------------
# 站点：全部走 HTTPS（证书建议 certbot/Cloudflare Origin 证书）
# ------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name media.example.com;

    ssl_certificate     /etc/letsencrypt/live/media.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/media.example.com/privkey.pem;

    # 全局静态资源直接给 Nginx
    location /static/ {
        alias /opt/study-assistant/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ============ 场景 B 关键段：proxy 分块上传 ============
    # 分块 POST 体可达 MEDIA_PART_SIZE（默认16MiB），必须关缓冲、放开上限
    location ~ ^/media/api/proxy/ {
        proxy_pass http://study_assistant;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 关掉请求/响应缓冲：分块上传与 Range 流都不能被 Nginx 整包缓冲
        proxy_request_buffering  off;
        proxy_buffering          off;
        client_max_body_size     0;          # 上限由应用层校验（≤ MEDIA_PART_SIZE）
        proxy_read_timeout       300s;
        proxy_send_timeout       300s;

        # 支持断点续传探测（GET 404/200）
        add_header Accept-Ranges bytes;
    }

    # ============ 场景 B：本地 Range 流（R2 不可用时的兜底）============
    location ~ ^/media/api/items/[0-9]+/stream$ {
        proxy_pass http://study_assistant;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering       off;
        proxy_request_buffering off;
        proxy_set_header Range $http_range;   # 透传 Range，由 Flask conditional 处理 206
        proxy_read_timeout    600s;
        add_header Accept-Ranges bytes;
    }

    # ============ 其它：页面 + API（含 /media/api/items* 签发等轻请求）============
    location / {
        proxy_pass http://study_assistant;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;                  # 流式响应（SSE/下载）不被缓冲
        proxy_read_timeout 120s;
    }
}

# HTTP → HTTPS
server {
    listen 80;
    server_name media.example.com;
    return 301 https://$host$request_uri;
}
